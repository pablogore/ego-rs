name: Production Gate

# Minimal mandatory CI gate (PROD-P1.2): fails a PR/push on regressions in
# the production-critical guarantees already closed as P0.1, P0.2, P0.3,
# P1.1, CORE-018, and PROD-014C. Does not build/publish anything — see
# CONTRIBUTING.md for what each step covers and how to reproduce locally.
#
# Runs as independent parallel jobs (lint / check / test / architecture /
# integration) instead of one sequential job: wall-clock is bounded by the
# slowest job, not the sum of all steps. `check` and `test` are split out of
# what used to be one "build-test" job — cargo check gives a fast fail
# signal on its own runner instead of queuing behind the workspace test run,
# and `test` uses cargo-nextest (parallel test-binary execution) instead of
# plain `cargo test`, which was the single slowest job in the gate (~520s,
# dwarfing lint/architecture/integration). `production-readiness` itself
# does no work — it only `needs:` the others, so it stays green/red exactly
# when they all do, and its name (the one branch protection requires on
# develop) never changes.
on:
  pull_request:
  push:
    branches: [develop, main]

concurrency:
  group: production-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  SHIPWRIGHT_VERSION: "v0.12.0"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned release binary from github.com/pablogore/shipwright — the
      # Dagger-backed pipeline runner. v0.12.0 is the first tagged release
      # with the "rust-command" provider Shipwright needs to run
      # "workspace-lint" as .shipwright/workflow.yaml now defines it (v0.8.0
      # had rust-command but a broken Docker-in-Docker fix; v0.9.0 was never
      # published as a release; v0.10.0 was the first consumable fix — v0.6.0,
      # pinned previously, predates rust-command entirely). Only
      # "workspace-lint" runs through this pinned binary today — the other
      # jobs below remain the load-bearing SHADOW/NATIVE REFERENCE until the
      # rest of .shipwright/workflow.yaml (still the CANONICAL CANDIDATE for
      # this entire gate, including the not-yet-enforced "workspace-format"
      # step) is promoted — see .shipwright/workflow.yaml and
      # .github/workflows/shipwright-validation.yml, which runs it complete
      # (single invocation, no -step) to prove equivalence. Dagger owns its
      # own build cache for this step, so no Swatinem/rust-cache here.
      - name: Install shipwright
        run: |
          curl -fL -o shipwright "https://github.com/pablogore/shipwright/releases/download/${SHIPWRIGHT_VERSION}/shipwright-linux-amd64"
          chmod +x shipwright

      # Shipwright's Dagger-backed providers need an active Dagger session:
      # `dagger run` provisions one (using the runner's Docker daemon) for
      # the wrapped command and tears it down after. Without it, shipwright
      # fails immediately with "connection refused" — no engine to talk to.
      - name: Install Dagger CLI
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh | sh
          echo "${PWD}/bin" >> "$GITHUB_PATH"

      - name: shipwright -step workspace-lint (clippy)
        run: dagger run ./shipwright --workflow .shipwright/workflow.yaml -step workspace-lint

  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the compiler; this resolves/installs it via
      # rustup (preinstalled on GitHub-hosted runners) and prints the version.
      - name: Resolve pinned Rust toolchain
        run: rustup show

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: cargo check --workspace --all-targets
        run: cargo check --workspace --all-targets

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve pinned Rust toolchain
        run: rustup show

      # cargo check (the `check` job) takes 109s; this job's nextest run
      # takes 397s building the exact same dependency graph plus ~114 test
      # binaries — the delta is link time, not type-checking, since `check`
      # never invokes the linker at all. mold is a drop-in faster linker for
      # exactly this shape (many small binaries) on Linux.
      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      # Prebuilt binary, not `cargo install` (which would compile nextest
      # itself on every cache miss) — nextest parallelizes test *binary*
      # execution across cores, unlike `cargo test`'s more conservative
      # default, and was the fix for this job's ~520s runtime.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: cargo nextest run --workspace
        run: cargo nextest run --workspace
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

      # nextest does not run doctests (a known, permanent limitation of the
      # tool, not a bug) — cargo test --doc keeps them covered without going
      # back to plain `cargo test` for everything else.
      - name: cargo test --doc --workspace
        run: cargo test --doc --workspace

  architecture:
    name: architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve pinned Rust toolchain
        run: rustup show

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: xtask verify-layers
        run: cargo run -p xtask -- verify-layers

      - name: xtask verify-isolation
        run: cargo run -p xtask -- verify-isolation

      - name: xtask verify-hygiene
        run: cargo run -p xtask -- verify-hygiene

  integration:
    name: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve pinned Rust toolchain
        run: rustup show

      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold

      # integration-tests is a deliberately separate Cargo workspace (see
      # integration-tests/Cargo.toml) with its own target dir and lockfile.
      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: integration-tests

      # run-suite provisions its own Postgres (16 + 14) via testcontainers,
      # migrates them, runs the real suite, and always reclaims the
      # containers before exiting — no secrets, no external services.
      - name: Production-critical integration suite (run-suite)
        run: cargo run --manifest-path integration-tests/Cargo.toml --bin run-suite
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

  production-readiness:
    name: production-readiness
    runs-on: ubuntu-latest
    needs: [lint, check, test, architecture, integration]
    steps:
      - run: echo "All Production Gate jobs passed."
