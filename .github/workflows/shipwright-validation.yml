name: Shipwright Validation (canonical candidate, non-blocking)

# Runs the FULL .shipwright/workflow.yaml — the CANONICAL CANDIDATE for
# ego-rs's Production Gate — with a single Shipwright invocation (no -step
# selection: an external scheduler must not cherry-pick individual steps,
# Shipwright's own graph decides what runs). Purely additive: does not touch
# production-gate.yml, replaces no native CI gate, and blocks nothing yet —
# production-gate.yml's native commands remain the load-bearing
# SHADOW/NATIVE REFERENCE this run is validated against. Builds shipwright
# from source off develop (PR #240/#241 merged there) instead of the pinned
# release: v0.8.0 was cut from main, which hasn't been promoted past #239
# yet, so no tagged release contains the rust-command provider or the
# AsService Docker-in-Docker fix that production-integration needs.
on:
  workflow_dispatch:
  push:
    branches: [opsx/shipwright-canonical-gate]

concurrency:
  group: shipwright-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate-canonical-workflow
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ego-rs
        uses: actions/checkout@v4

      # Plain `git clone`, not actions/checkout: the job's default
      # GITHUB_TOKEN is scoped to ego-rs only and actions/checkout has no way
      # to opt out of sending it (an explicit empty token: "" is rejected as
      # "not supplied"), so it gets sent to a different repo's fetch and
      # rejected outright. shipwright is public — an unauthenticated clone
      # needs no token at all.
      - name: Checkout shipwright (develop)
        run: git clone --depth 1 --branch develop https://github.com/pablogore/shipwright shipwright-src

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: shipwright-src/go.mod

      - name: Build shipwright from source
        run: |
          cd shipwright-src
          go build -o "${GITHUB_WORKSPACE}/shipwright" .

      - name: Install Dagger CLI
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh | sh
          echo "${PWD}/bin" >> "$GITHUB_PATH"

      - name: Resolve pinned Rust toolchain
        run: rustup show

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            integration-tests

      - name: shipwright (canonical workflow, full run — no -step)
        id: shipwright
        continue-on-error: true
        run: dagger run ./shipwright --workflow .shipwright/workflow.yaml

      - name: Check canonical workflow result
        if: always()
        run: |
          echo "shipwright (workspace-check, workspace-tests, workspace-lint, architecture-layers, architecture-isolation, repository-hygiene, production-integration): ${{ steps.shipwright.outcome }}"
          test "${{ steps.shipwright.outcome }}" = "success"
