name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify-layers:
    name: Verify hexagonal layers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check crate dependency graph
        run: bash scripts/verify-layers.sh

  verify-no-infra-in-tests:
    name: Verify no infrastructure in tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan test code for real infrastructure imports
        run: bash scripts/verify-no-infra-in-tests.sh

  verify-port-mocks:
    name: Verify port trait mock support
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan port traits for mock support
        run: bash scripts/verify-port-mocks.sh

  coverage:
    name: Test coverage (≥95%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin
      - name: Run coverage
        run: cargo tarpaulin --out xml --fail-under 95
