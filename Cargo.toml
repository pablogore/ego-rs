[workspace]
members = [
    "crates/domain",
    "crates/persistence-api",
    "crates/persistence-memory",
    "crates/application",
    "crates/infrastructure",
    "crates/persistence",
    "crates/persistence-stoolap",
    "crates/transport",
    "crates/runtime",
    "crates/runtime-tokio",
    "crates/effect-store",
    "crates/event-adapter",
    "crates/persistent-entity",
    "crates/ego-scheduler",
    "crates/service-sdk",
    "crates/service-sdk-macros",
    "crates/security-sdk",
    "crates/security-jwt",
    "crates/security-apikey",
    "crates/testkit",
    "examples/reference-app",
    "xtask",
]
resolver = "2"

[workspace.dependencies]
mockall = "0.14.0"
async-trait = "0.1"

# Link time, not type-checking, dominates the test job, and full debuginfo is
# most of what the linker has to move. Workspace crates keep line tables so
# backtraces still show file:line; dependencies carry no debuginfo at all.
# integration-tests/Cargo.toml is a separate workspace and repeats this block.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.test]
inherits = "dev"
