[package]
name = "reference-app"
version = "0.1.0"
edition = "2021"
publish = false

[features]
# Lets a build install the crash failpoint `RegisterUser` exposes, and nothing
# else. **Off by default, and it must stay off by default.**
#
# The trait and the `Option` field are always compiled: they are an ordinary
# explicit dependency, `None` in every build, and a null check at the call site.
# What this feature guards is the *activator* — the environment variable that
# turns that `None` into a process abort. Without the feature the composition
# root does not read the variable and the aborting implementation does not exist
# to be constructed, so no ordinary host can be pushed into aborting mid-request
# by an inherited variable.
#
# Only `integration-tests` enables it. That crate is a separate workspace rather
# than a member of this one, so Cargo's feature unification cannot carry it back
# into any build of this workspace.
crash-test-failpoint = []

[dependencies]
async-trait = "0.1"
axum = "0.7"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
kit-config = { git = "https://github.com/pablogore/kit-config.git", branch = "master" }
serde_json = "1"
ego-domain = { path = "../../crates/domain" }
ego-infrastructure = { path = "../../crates/infrastructure" }
ego-runtime = { path = "../../crates/runtime" }
# PROD-002 Phase 8: the reference app's durable external-effects backend —
# an embedded, no-external-server-dependency store (mirrors how the entity
# event stores use Postgres, but this one needs no separate service to run).
# A regular (non-dev) dependency: `main.rs` uses it in production, not only
# in tests.
ego-effect-store = { path = "../../crates/effect-store", features = ["stoolap"] }
persistent-entity = { path = "../../crates/persistent-entity" }
security-jwt = { path = "../../crates/security-jwt" }
ego-security-sdk = { path = "../../crates/security-sdk" }
ego-scheduler = { path = "../../crates/ego-scheduler" }
ego-persistence = { path = "../../crates/persistence" }
# Matches `EntityRuntimeBuilder::with_snapshot_store`'s `Arc<Mutex<dyn Snapshot
# + Send>>` field type exactly (persistent-entity/Cargo.toml) — a different
# `Mutex` would not satisfy that signature.
parking_lot = "0.12"
# The host owns the pool: it opens Postgres, runs migrations, and refuses to
# start without them. Nothing downstream degrades to memory on failure.
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres"] }
ego-service-sdk = { path = "../../crates/service-sdk" }
ego-service-sdk-macros = { path = "../../crates/service-sdk-macros" }
ego-transport = { path = "../../crates/transport" }
kitlogger = { git = "https://github.com/pablogore/kitlogger.git", branch = "develop" }
kitlogger-log-domain = { git = "https://github.com/pablogore/kitlogger.git", branch = "develop" }
# Needed by src/bin/server.rs (a real bin target, not a test/example — dev-deps
# aren't available to it): #[tokio::main] + TcpListener + signal::ctrl_c.
tokio = { version = "1", features = ["full"] }
utoipa = { version = "5.5.0", features = ["axum_extras"] }
# Pinned to the 8.x line: utoipa-swagger-ui's "axum" feature switched its
# transitive axum dependency to 0.8 starting at 9.0.0, which conflicts with
# this crate's axum = "0.7". 8.1.0 is the newest release still on axum 0.7.
utoipa-swagger-ui = { version = "=8.1.0", features = ["axum"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
ego-testkit = { path = "../../crates/testkit" }
# PROD-002 Phase 8: `tests/stoolap_restart_persistence.rs` opens a second,
# independent handle on the same on-disk DSN to read the raw `effect_state`
# row back — proving delivery landed in the REGISTERED Stoolap store, not
# merely that the executor was called. Same idiom as
# `crates/service-sdk/tests/effect_store_composition.rs`.
stoolap = "0.4"
# Same test: a fresh on-disk path shared across two independently-opened
# `StoolapEffectStore` instances (simulated process restart).
tempfile = "3"
# The in-memory metrics reader the OTLP adapter's acceptance test asserts through.
opentelemetry = { version = "0.32", default-features = false, features = ["metrics"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["metrics", "testing"] }
