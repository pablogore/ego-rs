[package]
name = "ego-runtime"
version = "0.1.0"
edition = "2021"

[dependencies]
ego-domain = { path = "../domain" }
# CORE-019 Phase 5 (AD-3): RuntimeEffectAcceptor implements the EffectAcceptor
# port trait defined in persistent-entity, keeping the runtime -> persistent-entity
# dependency direction (design.md §2) so the actor never depends on ego-runtime.
persistent-entity = { path = "../persistent-entity" }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }
async-trait = "0.1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
# CORE-019 Phase 11: observability signals (tracing macros, matching
# ego-scheduler's metric.rs convention) and a deterministic, non-reversible
# hash for the redacted idempotency key correlation field (spec:
# "Observability Signals" — never the raw key).
tracing = "0.1"
sha2 = "0.11.0"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "test-util", "time"] }
serde_json = "1"
