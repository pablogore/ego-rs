[package]
name = "ego-transport"
version = "0.1.0"
edition = "2021"

[dependencies]
ego-domain = { path = "../domain" }
ego-application = { path = "../application" }
ego-service-sdk = { path = "../service-sdk" }
ego-security-sdk = { path = "../security-sdk" }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = { workspace = true }
# gRPC is an optional second transport adapter. `default-features = false`
# keeps tonic to its metadata core: its defaults pull in a router, an HTTP/2
# server and a second axum major, none of which a metadata carrier needs.
tonic = { version = "0.14", optional = true, default-features = false }

[features]
# Deliberately absent from any `default` set: an HTTP-only build must never
# compile tonic. Enabling this feature is what makes the gRPC carrier exist.
grpc = ["dep:tonic"]

[dev-dependencies]
mockall = { workspace = true }
tokio-test = "0.4"
ego-service-sdk-macros = { path = "../service-sdk-macros" }
security-jwt = { path = "../security-jwt" }
ego-testkit = { path = "../testkit" }
