[package]
name = "security-jwt"
version = "0.1.0"
edition = "2021"

[dependencies]
ego-domain = { path = "../domain" }
ego-security-sdk = { path = "../security-sdk" }
jsonwebtoken = "9"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
async-trait = { workspace = true }
futures-executor = { version = "0.3", features = ["thread-pool"] }

[dev-dependencies]
