[package]
name = "ego-security-sdk"
version = "0.1.0"
edition = "2021"

[features]
dev-providers = []

[dependencies]
async-trait = "0.1"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ego-domain = { path = "../domain" }

[dev-dependencies]
mockall = "0.12"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
