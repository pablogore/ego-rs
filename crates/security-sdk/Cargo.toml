[package]
name = "ego-security-sdk"
version = "0.1.0"
edition = "2021"

[features]
dev-providers = []
# test-helpers is an alias for dev-providers — enables AlwaysAllow / AllowAllAuthorizationProvider
# for use in unit and integration tests without enabling all dev-providers.
test-helpers = ["dev-providers"]

[dependencies]
async-trait = "0.1"
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
ego-domain = { path = "../domain" }

[dev-dependencies]
mockall = "0.12"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
