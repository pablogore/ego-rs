[package]
name = "ego-service-sdk-macros"
version = "0.1.0"
edition = "2021"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"

[dev-dependencies]
ego-service-sdk = { path = "../service-sdk" }
async-trait = "0.1"
tokio = { version = "1.0", features = ["macros", "rt"] }