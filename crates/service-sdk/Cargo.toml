[package]
name = "ego-service-sdk"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
tokio = { version = "1.0", features = ["full"] }
tokio-util = { version = "0.7" }
semver = "1"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
kitlogger = { git = "https://github.com/pablogore/kitlogger.git", branch = "develop" }
kitlogger-formatter = { git = "https://github.com/pablogore/kitlogger.git", branch = "develop" }
ego-security-sdk = { path = "../security-sdk" }
ego-domain = { path = "../domain" }
# CORE-019 Phase 9: RuntimeBuilder::register_effect_executor wires a real
# ego-runtime effects::RuntimeEffectAcceptor, exposed through the
# persistent-entity EffectAcceptor port (design.md §2's dependency shape).
ego-runtime = { path = "../runtime" }
persistent-entity = { path = "../persistent-entity" }

[dev-dependencies]
ego-service-sdk-macros = { path = "../service-sdk-macros" }
# CORE-025 TASK-020: the acceptance walkthrough's TestKit scenario needs
# ego-testkit, which itself depends on ego-service-sdk normally. This is a
# dev-dependency-only cycle (allowed by Cargo — dev-deps are excluded from
# the normal dependency graph), used solely to build/run this crate's own
# integration tests, not the library itself.
ego-testkit = { path = "../testkit" }
tracing = "0.1"
tracing-subscriber = "0.3"
mockall = "0.12"
insta = { version = "1", features = ["filters"] }
trybuild = "1"
# tenant_scoped_lint.rs (CORE-008A TASK-014, code-review fix): AST-based scan
# instead of line-based text matching. Already present transitively via
# ego-service-sdk-macros's own syn dependency; pinned here directly so the
# lint's parsing is explicit and version-matched.
syn = { version = "2.0", features = ["full", "extra-traits", "visit"] }
proc-macro2 = "1.0"
# Test-only: capture-buffer exporter construction for TASK-008/TASK-022
# (KITLogger::with_exporter_and_format takes Arc<console_exporter::ConsoleExporterImpl>;
# kitlogger's crate root re-exports neither type it needs, per design.md's grounding finding).
console-exporter = { git = "https://github.com/pablogore/kitlogger.git", branch = "develop" }
kitlogger-log-domain = { git = "https://github.com/pablogore/kitlogger.git", branch = "develop" }