[package]
name = "ego-service-sdk"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
tokio = { version = "1.0", features = ["full"] }
tokio-util = { version = "0.7" }
# PROD-005 PR2: concurrent health-contributor fan-out (FuturesUnordered).
futures = "0.3"
semver = "1"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
kitlogger = { git = "https://github.com/pablogore/kitlogger.git", branch = "develop" }
kitlogger-formatter = { git = "https://github.com/pablogore/kitlogger.git", branch = "develop" }
ego-security-sdk = { path = "../security-sdk" }
ego-domain = { path = "../domain" }
# CORE-019 Phase 9: RuntimeBuilder::register_effect_executor wires a real
# ego-runtime effects::RuntimeEffectAcceptor, exposed through the
# persistent-entity EffectAcceptor port (design.md §2's dependency shape).
ego-runtime = { path = "../runtime" }
persistent-entity = { path = "../persistent-entity" }

# PROD-012 B6.4: the crate now names `DateTime<Utc>` itself. `ReserveRequest`
# carries a `lease_until`, and the runtime computes it from the configured
# clock, so this can no longer be a dev-only dependency — an earlier note here
# said "the crate itself never touches chrono", which stopped being true when
# reservations moved into the runtime.
chrono = { version = "0.4", features = ["serde"] }
# PROD-012 AD-3i: the runtime mints one OwnerId per instance in build(), so two
# replicas never share a reservation identity.
uuid = { version = "1", features = ["v4"] }
# PROD-012 AD-3f: the operation fingerprint is a digest of the canonical form of
# the typed arguments. The `fingerprint` column is VARCHAR(255), so the value
# stored has to be bounded — the canonical bytes themselves are not.
sha2 = "0.11.0"

[dev-dependencies]
ego-service-sdk-macros = { path = "../service-sdk-macros" }
# PROD-002 PR5 Phase 7.5: composition-only validation that a real embedded
# StoolapEffectStore can be selected through `with_effect_store` — dev-only,
# never a regular dependency, so the crate's hexagonal boundary (service-sdk
# must not depend on a concrete effect-store backend) stays intact.
ego-effect-store = { path = "../effect-store", features = ["stoolap"] }
# Same Phase 7.5 test: opens a second, independent handle on the same DSN to
# read the raw `effect_state` row back, proving dispatch landed in Stoolap
# specifically rather than a silently-substituted InMemoryEffectStore.
stoolap = "0.4"
# Phase 7.5: a fresh on-disk path for the embedded StoolapEffectStore, same
# idiom `ego-effect-store`'s own Tier 2 tests already use.
tempfile = "3"
# PROD-005 PR2: `#[tokio::test(start_paused = true)]` for deterministic
# virtual-time health-aggregation timeout tests (feature unifies with the
# main `tokio` dependency above for test builds).
tokio = { version = "1.0", features = ["test-util"] }
# CORE-025 TASK-020: the acceptance walkthrough's TestKit scenario needs
# ego-testkit, which itself depends on ego-service-sdk normally. This is a
# dev-dependency-only cycle (allowed by Cargo — dev-deps are excluded from
# the normal dependency graph), used solely to build/run this crate's own
# integration tests, not the library itself.
ego-testkit = { path = "../testkit" }
tracing = "0.1"
tracing-subscriber = "0.3"
mockall = "0.12"
insta = { version = "1", features = ["filters"] }
trybuild = "1"
# tenant_scoped_lint.rs (CORE-008A TASK-014, code-review fix): AST-based scan
# instead of line-based text matching. Already present transitively via
# ego-service-sdk-macros's own syn dependency; pinned here directly so the
# lint's parsing is explicit and version-matched.
syn = { version = "2.0", features = ["full", "extra-traits", "visit"] }
proc-macro2 = "1.0"
# Test-only: capture-buffer exporter construction for TASK-008/TASK-022
# (KITLogger::with_exporter_and_format takes Arc<console_exporter::ConsoleExporterImpl>;
# kitlogger's crate root re-exports neither type it needs, per design.md's grounding finding).
console-exporter = { git = "https://github.com/pablogore/kitlogger.git", branch = "develop" }
kitlogger-log-domain = { git = "https://github.com/pablogore/kitlogger.git", branch = "develop" }