[package]
name = "ego-infrastructure"
version = "0.1.0"
edition = "2021"

[dependencies]
ego-domain = { path = "../domain" }
ego-application = { path = "../application" }
ego-persistence = { path = "../persistence" }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "json", "migrate"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
opentelemetry = { version = "0.32", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace", "rt-tokio"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "grpc-tonic", "reqwest-client", "http-proto"] }
tracing = "0.1"

[dev-dependencies]
mockall = { workspace = true }
tokio-test = "0.4"
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1"
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace", "testing"] }
