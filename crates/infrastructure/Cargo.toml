[package]
name = "ego-infrastructure"
version = "0.1.0"
edition = "2021"

[dependencies]
ego-domain = { path = "../domain" }
ego-application = { path = "../application" }
ego-persistence = { path = "../persistence" }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "json", "migrate"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
opentelemetry = { version = "0.32", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace", "rt-tokio"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "grpc-tonic", "reqwest-blocking-client", "http-proto"] }
tracing = "0.1"
dashmap = "6"

[dev-dependencies]
# The shared EventStore conformance harness. A dev-dependency only: testkit is
# tooling, and no production crate may depend on it at build time. verify-layers
# excludes dev edges for exactly this reason.
ego-testkit = { path = "../testkit" }
mockall = { workspace = true }
tokio-test = "0.4"
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1"
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace", "testing"] }
# F2: real OTLP stub-collector integration tests (gRPC + HTTP wire round-trip)
opentelemetry-proto = { version = "0.32", default-features = false, features = ["gen-tonic", "trace"] }
tonic = "0.14"
tokio-stream = { version = "0.1", features = ["net"] }
prost = "0.14"
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
