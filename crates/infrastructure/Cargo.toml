[package]
name = "ego-infrastructure"
version = "0.1.0"
edition = "2021"

[dependencies]
ego-domain = { path = "../domain" }
ego-application = { path = "../application" }
ego-persistence = { path = "../persistence" }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "json", "migrate"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
mockall = { workspace = true }
tokio-test = "0.4"
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1"
