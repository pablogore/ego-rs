[package]
name = "ego-integration-tests"
version = "0.1.0"
edition = "2021"
# This crate ships no library or binary of its own; it exists only to hold
# tests that need a real external resource (a database, today) and cannot
# run as `#[cfg(test)]` units inside a production crate. Never publish it.
publish = false

[dev-dependencies]
ego-domain = { path = "../domain" }
ego-persistence = { path = "../persistence" }
ego-testkit = { path = "../testkit" }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "json"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres"] }
