[package]
name = "ego-domain"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
async-trait = { workspace = true }
rand = "0.8"

[dev-dependencies]
mockall = { workspace = true }
tokio = { version = "1", features = ["full"] }
