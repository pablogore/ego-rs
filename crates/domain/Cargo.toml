[package]
name = "ego-domain"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
async-trait = { workspace = true }
rand = "0.8"
# Redaction primitive for telemetry: `OperationKeyHash` hashes a client-supplied
# operation key so the raw value is not expressible as a span attribute. The rule
# is a domain rule (CORE-019 §12), so it lives with the type it protects rather
# than in an adapter that could be bypassed.
sha2 = "0.11.0"

[dev-dependencies]
mockall = { workspace = true }
tokio = { version = "1", features = ["full"] }
