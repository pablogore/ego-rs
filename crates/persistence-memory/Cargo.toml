[package]
name = "ego-persistence-memory"
version = "0.1.0"
edition = "2021"

[dependencies]
ego-persistence-api = { path = "../persistence-api" }
async-trait = { workspace = true }
serde_json = "1"

[dev-dependencies]
# read_side/store.rs's relocated `#[cfg(test)]` module: `#[tokio::test]`
# (design.md EC-4).
tokio = { version = "1", features = ["macros", "rt"] }
# Dev-only in S1: only the relocated `read_side/store.rs` test module names
# `chrono::Utc`. Promoted to a normal dependency in S2 when the reservation
# store arrives (design.md EC-7, AD-2).
chrono = { version = "0.4", features = ["serde"] }
