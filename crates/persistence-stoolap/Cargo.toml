[package]
name = "ego-persistence-stoolap"
version = "0.1.0"
edition = "2021"

[dependencies]
ego-persistence-api = { path = "../persistence-api" }
stoolap = "0.4"
serde = "1"
serde_json = "1"
# `event-sourcing` feature only (design.md AD-1): `StoolapEventStore` bridges
# `EventStore<E>`'s `#[async_trait]` surface to Stoolap's synchronous API via
# `spawn_blocking` — the same shape as `StoolapEffectStore`
# (`effect-store/src/stoolap/mod.rs`). Optional so `Repository<A>`/`Snapshot`
# consumers of this crate gain no new dependency.
chrono = { version = "0.4", features = ["serde"], optional = true }
tokio = { version = "1", optional = true, features = ["rt"] }
async-trait = { version = "0.1", optional = true }
# `operation-reservation` feature only (design.md AD-7): `Clock` for the
# reservation store's injected-time reads.
ego-domain = { path = "../domain", optional = true }
# Stoolap's `core::Value` has no binary/BYTEA variant, so `response` bytes
# are stored as base64-encoded TEXT — same convention as
# `effect-store/src/stoolap/mod.rs`.
base64 = { version = "0.22", optional = true }

[dev-dependencies]
# The shared conformance harness (S3). One direction only: ego-testkit has no
# dependency on this crate, so no cycle.
ego-testkit = { path = "../testkit" }
# Every test needs a database directory of its own.
tempfile = "3"
# Enables stoolap's own built-in I/O failpoints (WAL write/sync) so the
# commit-time error-classification path in `save()` can be exercised without
# a real disk failure. Feature-unified only into test builds; `cargo build`
# never enables it (verify-remediation, spec R6/AD-5 criterion 4 follow-up).
stoolap = { version = "0.4", features = ["test-failpoints"] }
# Slice 3's restart-recovery test drives the real `EntityRuntimeBuilder`
# composition path. No cycle: `persistent-entity` does not depend on this
# crate (design.md).
persistent-entity = { path = "../persistent-entity" }
# `EntityRuntimeBuilder::with_snapshot_store` takes `Arc<Mutex<dyn Snapshot>>`
# keyed to this exact lock type — matches `persistent-entity`'s own choice.
parking_lot = "0.12"
# `event_sourcing`'s colocated tests run under plain `#[tokio::test]`
# (current-thread) — the same flavor `StoolapEffectStore`'s conformance suite
# uses, and the one `spawn_blocking` (not `block_in_place`) is required to
# work under.
tokio = { version = "1", features = ["macros", "rt"] }

[features]
event-sourcing = ["dep:tokio", "dep:async-trait", "dep:chrono"]
# STOOLAP-S3 (design.md AD-7): a new feature rather than reusing
# `event-sourcing`, because this store needs `ego-domain` (for `Clock`) and
# `base64` deps that `event-sourcing` consumers should not gain.
operation-reservation = [
    "dep:tokio",
    "dep:async-trait",
    "dep:chrono",
    "dep:ego-domain",
    "dep:base64",
]
# STOOLAP-RS-01 (design.md AD-1): all four deps are already declared above
# for `event-sourcing`/`operation-reservation` — zero manifest additions,
# zero new transitive edges. `base64` is deliberately excluded: no read-side
# column stores bytes.
read-side = ["dep:tokio", "dep:async-trait", "dep:chrono", "dep:ego-domain"]

# Cargo can't feature-gate code inside a `tests/` binary, only the binary
# itself: `cargo check --workspace --all-targets` (CI, no explicit
# `--features`) must skip this target rather than fail to compile it.
[[test]]
name = "production_restart_recovery"
required-features = ["event-sourcing"]

[[test]]
name = "reservation_conformance"
required-features = ["operation-reservation"]

[[test]]
name = "read_side_stores"
required-features = ["read-side"]
