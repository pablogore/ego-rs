[package]
name = "ego-persistence-stoolap"
version = "0.1.0"
edition = "2021"

[dependencies]
ego-persistence-api = { path = "../persistence-api" }
stoolap = "0.4"
serde = "1"
serde_json = "1"
# `event-sourcing` feature only (design.md AD-1): `StoolapEventStore` bridges
# `EventStore<E>`'s `#[async_trait]` surface to Stoolap's synchronous API via
# `spawn_blocking` — the same shape as `StoolapEffectStore`
# (`effect-store/src/stoolap/mod.rs`). Optional so `Repository<A>`/`Snapshot`
# consumers of this crate gain no new dependency.
chrono = { version = "0.4", features = ["serde"], optional = true }
tokio = { version = "1", optional = true, features = ["rt"] }
async-trait = { version = "0.1", optional = true }

[dev-dependencies]
# The shared conformance harness (S3). One direction only: ego-testkit has no
# dependency on this crate, so no cycle.
ego-testkit = { path = "../testkit" }
# Every test needs a database directory of its own.
tempfile = "3"
# Enables stoolap's own built-in I/O failpoints (WAL write/sync) so the
# commit-time error-classification path in `save()` can be exercised without
# a real disk failure. Feature-unified only into test builds; `cargo build`
# never enables it (verify-remediation, spec R6/AD-5 criterion 4 follow-up).
stoolap = { version = "0.4", features = ["test-failpoints"] }
# Slice 3's restart-recovery test drives the real `EntityRuntimeBuilder`
# composition path. No cycle: `persistent-entity` does not depend on this
# crate (design.md).
persistent-entity = { path = "../persistent-entity" }
# `event_sourcing`'s colocated tests run under plain `#[tokio::test]`
# (current-thread) — the same flavor `StoolapEffectStore`'s conformance suite
# uses, and the one `spawn_blocking` (not `block_in_place`) is required to
# work under.
tokio = { version = "1", features = ["macros", "rt"] }

[features]
event-sourcing = ["dep:tokio", "dep:async-trait", "dep:chrono"]
