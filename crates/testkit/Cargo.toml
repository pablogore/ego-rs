[package]
name = "ego-testkit"
version = "0.1.0"
edition = "2021"

[features]
# Opt-in ONLY: re-exports ego-security-sdk's AllowAllAuthorizationProvider.
# Off by default so the dev-providers feature is never silently unified across
# the workspace (see design.md AD-3). ScriptedAuthorizationProvider::allow_all()
# is the default allow path and needs no feature.
dev-providers = ["ego-security-sdk/test-helpers"]

[dependencies]
async-trait = "0.1"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
ego-domain = { path = "../domain" }
ego-persistence-memory = { path = "../persistence-memory" }
ego-runtime = { path = "../runtime" }
ego-security-sdk = { path = "../security-sdk" }
ego-service-sdk = { path = "../service-sdk" }
persistent-entity = { path = "../persistent-entity" }
kitlogger = { git = "https://github.com/pablogore/kitlogger.git", branch = "develop" }
kitlogger-formatter = { git = "https://github.com/pablogore/kitlogger.git", branch = "develop" }
console-exporter = { git = "https://github.com/pablogore/kitlogger.git", branch = "develop" }
kitlogger-log-domain = { git = "https://github.com/pablogore/kitlogger.git", branch = "develop" }
# PROD-005 PR3 TASK-027/028: StaticHealthContributor::with_delay's `check()`
# sleeps via `tokio::time::sleep` — real library code, not test-only, so
# `time` is a normal (non-dev) feature here.
tokio = { version = "1.0", features = ["time"] }

[dev-dependencies]
ego-service-sdk-macros = { path = "../service-sdk-macros" }
# `test-util` unifies with the `time` feature above to enable
# `#[tokio::test(start_paused = true)]` for deterministic delay assertions.
tokio = { version = "1.0", features = ["macros", "rt", "test-util"] }
