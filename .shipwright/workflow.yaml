apiVersion: shipwright.dev/v1
kind: Workflow
metadata:
  name: ego-rs-production-gate
  description: >-
    CANONICAL CANDIDATE for ego-rs's Production Gate, run entirely through
    Shipwright's Dagger-backed Rust providers. Every step below is the
    Shipwright equivalent of a currently load-bearing command in
    .github/workflows/production-gate.yml (see that file's own comments for
    the native/shadow reference it still runs in parallel). Step ids name
    the responsibility each gate protects, not the tool that happens to
    implement it today (xtask, cargo-run, etc.) — see CONTRIBUTING.md for
    the full command-to-step mapping.
spec:
  source:
    path: .
  steps:
    # Equivalent of: cargo fmt --all -- --check
    # No dedicated "fmt" provider exists in Shipwright's providers/rust
    # registry (rust, rust-test, rust-integration-test, rust-command,
    # clippy, cargo-audit, rust-container — no fmt/rustfmt entry, confirmed
    # against internal/workflow/providers/register.go). rust-command is
    # Shipwright's own generic escape hatch for exactly this gap.
    - id: workspace-format
      capability: test
      uses:
        provider: rust-command
        version: "1"
      with:
        rustVersion: "1.90.0"
        command: "fmt --all -- --check"
        cacheKey: workspace-format

    # Equivalent of: cargo check --workspace --all-targets
    - id: workspace-check
      capability: test
      uses:
        provider: rust-command
        version: "1"
      with:
        rustVersion: "1.90.0"
        command: "check --workspace --all-targets"
        cacheKey: workspace-check

    # Equivalent of: cargo test --workspace
    # No `locked: true` here on purpose: the native gate does not pass
    # --locked, and rust-test's --locked would make this step strictly
    # stricter (fail on a resolvable-but-stale Cargo.lock the native command
    # would silently accept) — not an exact equivalent. See the audit report
    # for the full argv comparison.
    - id: workspace-tests
      capability: test
      uses:
        provider: rust-test
        version: "1"
      with:
        rustVersion: "1.90.0"

    # Equivalent of: cargo clippy --workspace --all-targets --all-features -- -D warnings
    # NOT the dedicated "clippy" provider: RustLinter (providers/rust/rustlinter.go)
    # hardcodes `cargo clippy --all-targets -- -D warnings` with no
    # AllFeatures/Features field on its struct at all (unlike RustUnitTester,
    # which does expose AllFeatures) — there is no way to express issue #229's
    # literal `--workspace --all-features` contract through it. rust-command
    # is Shipwright's own generic escape hatch, already load-bearing
    # elsewhere in this manifest, so this closes the gap without requiring
    # any change to Shipwright itself.
    - id: workspace-lint
      capability: test
      uses:
        provider: rust-command
        version: "1"
      with:
        rustVersion: "1.90.0"
        command: "clippy --workspace --all-targets --all-features -- -D warnings"
        cacheKey: workspace-lint

    # Equivalent of: cargo run -p xtask -- verify-layers
    - id: architecture-layers
      capability: test
      uses:
        provider: rust-command
        version: "1"
      with:
        rustVersion: "1.90.0"
        command: "run -p xtask -- verify-layers"
        cacheKey: xtask

    # Equivalent of: cargo run -p xtask -- verify-isolation
    - id: architecture-isolation
      capability: test
      uses:
        provider: rust-command
        version: "1"
      with:
        rustVersion: "1.90.0"
        command: "run -p xtask -- verify-isolation"
        cacheKey: xtask

    # Equivalent of: cargo run -p xtask -- verify-hygiene
    - id: repository-hygiene
      capability: test
      uses:
        provider: rust-command
        version: "1"
      with:
        rustVersion: "1.90.0"
        command: "run -p xtask -- verify-hygiene"
        cacheKey: xtask

    # Equivalent of:
    #   cargo run --manifest-path integration-tests/Cargo.toml --bin run-suite
    # rust-command, not rust-integration-test: the latter always invokes
    # plain `cargo test`, which cannot express run-suite as an entrypoint —
    # only rust-command's arbitrary `command` can. docker: true attaches the
    # validated Docker-in-Docker daemon (providers/rust/dockerdaemon.go) that
    # run-suite's testcontainers-rs needs to provision Postgres 16 and 14.
    # cacheKey isolated from "xtask"/default: integration-tests is a
    # deliberately separate Cargo workspace (its own Cargo.toml, lockfile,
    # target dir) — sharing a target cache with the root workspace's xtask
    # builds would mix two independent dependency graphs in the same cache
    # volume for no benefit.
    - id: production-integration
      capability: test
      uses:
        provider: rust-command
        version: "1"
      with:
        rustVersion: "1.90.0"
        manifestPath: integration-tests/Cargo.toml
        command: "run --bin run-suite"
        docker: true
        cacheKey: run-suite

  execution:
    failFast: false
    timeout: 30m
