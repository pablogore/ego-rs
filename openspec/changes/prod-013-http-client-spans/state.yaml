notes: |
  Defines the instrumentation contract for OUTBOUND HTTP requests: a
  SpanKind::Client span, HTTP semantic-convention attributes, span
  status/error/duration, continued traceparent propagation, an explicit
  double-instrumentation avoidance rule, and an explicit retry-span model —
  decoupled from any concrete HTTP client via a hexagonal port, with
  OpenTelemetry confined to infrastructure and ego-domain kept vendor-neutral.

  DEPENDS ON PROD-012 (Inbound Sampling Propagation): PROD-013 MUST land AFTER
  PROD-012. A client span MUST honor the completed inbound sampling decision that
  PROD-012 makes TraceContext carry; before PROD-012 there is no faithful
  decision to inherit (v1 hardcodes -01). PROD-012's own proposal names PROD-013
  as its dependent.

  Resolved forks: retry-span model (ADR-4) = one SpanKind::Client span per
  attempt (Option B), tagged with http.request.resend_count. Semantic-convention
  version (ADR-2) pinned to OTel Semantic Conventions v1.37.0, vendored by
  opentelemetry-semantic-conventions 0.32 (aligned to the pinned 0.32 opentelemetry
  stack); HTTP client attribute set stable since semconv v1.23.0; exact vendored
  version re-verified at apply time against the crate's SCHEMA_URL constant.

  Supersedes the v1 "outbound is propagation-only, MUST NOT create its own client
  span" requirement and the "client/server transport spans out of scope" clause
  via explicit MODIFIED deltas on distributed-tracing (propagation is retained;
  the client span is added). No dedicated open issue — a PROD-003 follow-up in the
  outbound-tracing line. Chained delivery intended: PR1 domain contract → PR2 infra
  OTLP client-span + semconv + sampling → PR3 transport helper + reference call
  site + double-instrumentation/retry; only the tracker merged to develop.
  Canonical openspec/specs and production code are intentionally NOT edited in this
  planning phase.
