notes: |
  CORE-018 is a complete dogfooding milestone: a reference implementation of
  tenant-scoped user registration using only public SDK APIs. ego-transport
  becomes a real axum HTTP server mechanism; reference-app extends with
  PersistentEntity aggregates, a guarded service, and full E2E test coverage.

  All 31 planned tasks were implemented across 3 chained PRs and verified
  independently at each merge gate. The final verify found 3 non-critical
  WARNINGs (coverage gap in HTTP error mapping, doc comment off-by-one, stale
  task cross-reference) — all fixed before merge. An additional integration
  defect (missing tokio feature) was discovered post-merge via isolated crate
  testing and immediately fixed in PR #161.

