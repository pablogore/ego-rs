notes: |
  Independent change — no hard dependency on any other active change. Builds on
  the archived CORE-019 reliable-effects lineage
  (openspec/changes/archive/2026-07-15-core-019-reliable-external-effects/):
  the EffectStateStore/EffectDedupStore ports, the EffectStoreError
  transient/permanent split (store.rs:106-135), the chrono-backed Timestamp
  (store.rs:44-70), and the AD-8 non-atomic-claim_due single-consumer invariant
  (core-019 design.md:68) this change extends. There is NO dedicated open issue;
  CORE-019 is the related, archived lineage referenced as context only.

  Delivers the durable delivery store the CORE-019 non-goals said "none ships"
  (spec.md:307-320), as a MODIFIED delta on the external-effects capability plus
  a new additive lease port. InMemoryEffectStore is retained unchanged as the
  reference/test implementation. Three proposal forks are resolved in design:
  ADR-1 storage technology = Postgres-outbox via the existing (unused-by-effects)
  sqlx 0.8 dependency (Verdict, not pre-decided in the proposal); ADR-2 lease
  shape = a NEW supplementary LeasedEffectStore port rather than extending
  EffectStateStore (keeps claim_due's single-consumer contract and all in-memory
  tests intact); ADR-3 consumer model = support both single- and multi-consumer,
  with leasing (visibility-timeout) enabling the multi-consumer case.

  Frozen guarantees preserved: at-least-once, NEVER exactly-once ("exactly once"
  must not appear anywhere); ordering explicitly unguaranteed; dedup scope stays
  (tenant, effect_type, key); bounded metric cardinality. Adapter confined to
  crates/infrastructure (sole sqlx consumer); ports stay vendor-neutral.

  PR-chain intent: feature-branch-chain PR1 (lease port + DTOs) -> PR2 (shared
  port contract test-suite) -> PR3 (Postgres adapter + migration + integration
  tests); only the tracker merged to develop. All production files in the design
  File Changes table are FUTURE work — this planning change creates only the
  OpenSpec artifacts.
