notes: |
  Preserve and honor the inbound W3C sampling decision instead of forcing
  always-on. Supersedes the v1 "Sampling Is Always-On In v1" requirement: the
  distributed-tracing delta REMOVES that requirement (with Reason + Migration)
  and MODIFIES both "TraceContext Distinguishes Inbound Origination From Raw
  Parsing" (parse_traceparent now returns the SamplingDecision; from_inbound
  preserves it) and "Out of Scope for v1" (parent-based honoring moves in scope;
  configurable/ratio sampling stays out).

  Hexagonal boundary: the SamplingDecision enum + opaque tracestate live in
  ego-domain (zero opentelemetry types); the SamplingDecision -> TraceFlags /
  TraceState and ParentBased sampler mapping live ONLY in the infrastructure
  adapter (crates/infrastructure/src/tracing_otlp.rs).

  Design forks resolved: ADR-1 domain enum + opaque tracestate (not OTel types
  on the context); ADR-2 parent-based policy honoring valid inbound decisions
  with a deterministic local-root default of Sampled (fork A — preserves v1's
  effective behavior for locally-originated roots); ADR-3 REMOVE always-on +
  targeted MODIFY rather than a silent contradiction.

  Dependencies: independent of other in-flight changes; a PROD-003
  distributed-tracing follow-up. PROD-013 (HTTP client spans) DEPENDS ON this
  change (a client span must carry the honored decision). No dedicated open
  issue — issue #212 was the unrelated operation-naming follow-up (already
  resolved) and does NOT cover this work.

  Single PR expected (~250-350 lines, under the 400-line budget): domain and
  infra land together because the parse_traceparent signature change spans both.
  Canonical openspec/specs/distributed-tracing/spec.md is NOT edited during
  planning — the delta reconciles it on archive.
